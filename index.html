<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Dwujęzyczny atlas steeringu i activation patchingu w modelach generujących muzykę symboliczną.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <title>MI-MIDI — atlas interwencji</title>
  </head>
  <body>
    <header class="hero">
      <div class="language-switch" aria-label="Language">
        <button class="language-button" type="button" data-language="pl">PL</button>
        <button class="language-button" type="button" data-language="en">EN</button>
      </div>
      <div class="eyebrow" data-text="heroEyebrow"></div>
      <h1 data-text="heroTitle"></h1>
      <p class="lead" data-text="heroLead"></p>
      <div class="stats" id="stats"></div>
      <a class="sae-link" href="https://jpocwiar.github.io/MI-MIDIv2-Demo/">
        <span data-text="saeLinkKicker"></span>
        <strong data-text="saeLink"></strong>
        <span aria-hidden="true">→</span>
      </a>
    </header>

    <section class="method">
      <details>
        <summary data-text="methodSummary"></summary>
        <div class="method-grid" id="methodGrid"></div>
      </details>
    </section>

    <nav class="toolbar" aria-label="Intervention type">
      <div class="tabs">
        <button class="tab is-active" type="button" data-view="steering" data-text="steeringTab"></button>
        <button class="tab" type="button" data-view="patching" data-text="patchingTab"></button>
      </div>
      <div class="toolbar-language" aria-label="Language">
        <button class="language-button" type="button" data-language="pl">PL</button>
        <button class="language-button" type="button" data-language="en">EN</button>
      </div>
    </nav>

    <main>
      <section id="steeringView" class="view"></section>
      <section id="patchingView" class="view" hidden></section>
    </main>

    <footer class="footer">
      <p data-text="footerAudio"></p>
      <p data-text="footerProvenance"></p>
      <p><a href="https://jpocwiar.github.io/MI-MIDIv2-Demo/" data-text="saeFooter"></a></p>
    </footer>

    <script src="library.js"></script>
    <script src="script.js"></script>
  </body>
</html>
