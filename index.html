<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="MI-MIDI — steering i activation patching modeli generujących muzykę symboliczną.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <title>MI-MIDI</title>
  </head>
  <body>
    <header class="hero">
      <h1>MI-MIDI</h1>
    </header>

    <nav class="toolbar" aria-label="Intervention type">
      <div class="tabs">
        <button class="tab is-active" type="button" data-view="steering">Steering</button>
        <button class="tab" type="button" data-view="patching">Activation patching</button>
      </div>
      <div class="languages" aria-label="Language">
        <button class="language-button" type="button" data-language="pl">PL</button>
        <button class="language-button" type="button" data-language="en">EN</button>
      </div>
    </nav>

    <main>
      <section id="steeringView" class="view">
        <div class="controls">
          <label><span data-text="model"></span><select id="steeringModel"></select></label>
          <label><span data-text="concept"></span><select id="steeringConcept"></select></label>
        </div>
        <div id="steeringSamples"></div>
      </section>

      <section id="patchingView" class="view" hidden>
        <div class="controls">
          <label><span data-text="model"></span><select id="patchingModel"></select></label>
          <label><span data-text="direction"></span><select id="patchingDirection"></select></label>
        </div>
        <div id="patchingSamples"></div>
      </section>
    </main>

    <footer>
      <a href="https://jpocwiar.github.io/MI-MIDIv2-Demo/" data-text="saeLink"></a>
    </footer>

    <script src="library.js"></script>
    <script src="script.js"></script>
  </body>
</html>
